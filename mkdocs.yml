site_name: DungeonBrew
site_description: Resources for TTPRGs
site_author: DungeonBrew

theme:
  name: material
  custom_dir: overrides
  font:
    text: Bitter
    code: Roboto Mono
  palette:
    scheme: slate
    primary: blue grey
    accent: deep orange
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tooltips

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - tables
  - attr_list
  - md_in_html
  - sane_lists

